<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>G3MWebBridge CODE Reader Diagnostic</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            padding: 24px;
            margin: 0;
        }

        h1 {
            margin-top: 0;
        }

        #out {
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
  <h1>G3MWebBridge Test</h1>

  <div>
    <label for="patchFile">
      Select a .g3mpatch:
    </label>

    <input
      id="patchFile"
      type="file"
      accept=".g3mpatch">
  </div>

  <pre id="out">Loading...</pre>

  <script type="module" src="./main.js"></script>
</body>
</html>
